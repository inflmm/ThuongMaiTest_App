spring.config.import=optional:file:.env[.properties]
spring.application.name=ThuongMaiEurekaProduct
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.pnpvbbqfrsjjqcezwtdx.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.web.resources.cache.period=3600
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Supabase Storage Configuration
supabase.url=${SUPA_URL}
supabase.service-key=${SUPA_SERVICE_KEY}
supabase.bucket-name=${SUPA_BUCKET_NAME}

app.cron.secret-token=${SECRET_CRON_TOKEN}
// Enable or disable analytics tracking (disable in development or testing environments)
app.analytics.enabled=${ANALYTICS_ENABLED:true}
// Configure session tracking to use cookies only, preventing URL-based session tracking
server.servlet.session.tracking-modes=cookie
// Disable persistent sessions to ensure that session cookies are not stored across server restarts
server.servlet.session.persistent=false